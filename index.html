    <!--
      ┌─────────────────────────────────────────────────────────────────┐
      │  Google Consent Mode v2 — Advanced                              │
      │  CE BLOC DOIT IMPÉRATIVEMENT PRÉCÉDER GTM                      │
      │                                                                 │
      │  Signaux gérés :                                                │
      │    analytics_storage    → GA4 cookies                          │
      │    ad_storage           → Google Ads cookies                   │
      │    ad_user_data         → Envoi données utilisateur à Google   │
      │    ad_personalization   → Personnalisation publicitaire        │
      │                                                                 │
      │  Mode Advanced : GTM se charge toujours (même sans consentement│
      │  accordé) et envoie des pings sans cookies. Google modélise    │
      │  les données manquantes pour conserver la valeur analytique.   │
      └─────────────────────────────────────────────────────────────────┘
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}

      // Redaction des identifiants publicitaires quand ad_storage est denied
      gtag('set', 'ads_data_redaction', true);

      (function() {
        // État par défaut : tout refusé, GTM attend 500ms la réponse de la bannière
        var denied = {
          analytics_storage:  'denied',
          ad_storage:         'denied',
          ad_user_data:       'denied',
          ad_personalization: 'denied',
          wait_for_update:    500
        };

        try {
          var raw = localStorage.getItem('dm_consent');
          if (raw) {
            var c = JSON.parse(raw);
            // Consentement déjà enregistré (visite de retour) → appliquer sans attente
            if (c && c.version === '1') {
              gtag('consent', 'default', {
                analytics_storage:  c.analytics ? 'granted' : 'denied',
                ad_storage:         c.ads       ? 'granted' : 'denied',
                ad_user_data:       c.ads       ? 'granted' : 'denied',
                ad_personalization: c.ads       ? 'granted' : 'denied',
                wait_for_update:    0
              });
              return;
            }
          }
        } catch(e) {
          // localStorage indisponible → tomber sur le défaut
        }

        // Première visite ou consentement invalide → défaut denied
        gtag('consent', 'default', denied);
      })();
    </script>
    <!-- End Google Consent Mode v2 -->

    <!-- Google Analytics 4 — chargé après window.load pour ne pas bloquer le LCP -->
    <script>
      gtag('js', new Date());
      gtag('config', 'G-R3EY7H9Y2Z', { send_page_view: false });
      function _loadGtag(){
        var s=document.createElement('script');s.async=true;
        s.src='https://www.googletagmanager.com/gtag/js?id=G-R3EY7H9Y2Z';
        document.head.appendChild(s);
      }
      if(document.readyState==='complete'){_loadGtag();}
      else{window.addEventListener('load',_loadGtag);}
    </script>
    <!-- End Google Analytics 4 -->

          <h2 style="color:#00ABA8;font-size:1.2rem;margin-bottom:1rem">La pollution marine en Méditerranée</h2>
          <ul style="list-style:none;padding:0">
            <li style="margin-bottom:0.5rem">• 8 millions de tonnes de plastique sont déversées chaque année dans l'océan</li>
            <li style="margin-bottom:0.5rem">• 80% des déchets marins proviennent d'activités terrestres</li>
            <li style="margin-bottom:0.5rem">• La Méditerranée est l'une des mers les plus polluées au monde en concentration de microplastiques</li>
            <li style="margin-bottom:0.5rem">• 95% des déchets flottants en Méditerranée sont des plastiques</li>
            <li style="margin-bottom:0.5rem">• La mer Méditerranée concentre 7% des microplastiques mondiaux pour moins de 1% de la surface océanique</li>
            <li style="margin-bottom:0.5rem">• Plus de 90% des oiseaux marins ont déjà ingéré du plastique</li>
            <li style="margin-bottom:0.5rem">• Un sac plastique peut persister plusieurs centaines d'années en mer</li>
            <li style="margin-bottom:0.5rem">• Plus de 600 espèces marines méditerranéennes sont affectées par les déchets plastiques</li>
            <li style="margin-bottom:0.5rem">• Les plastiques fragmentés contaminent les fonds marins entre 0 et 20 mètres de profondeur</li>
            <li style="margin-bottom:0.5rem">• Chaque année, des centaines de tonnes de déchets sont collectées sur le littoral des Calanques</li>
            <li style="margin-bottom:0.5rem">• Les densités de microplastiques en Méditerranée dépassent celles des gyres océaniques</li>
            <li style="margin-bottom:0.5rem">• Le bassin méditerranéen subit une pression touristique parmi les plus fortes au monde</li>
          </ul>
