<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #02080d;
        font-family: "Inter", sans-serif;
      }

      /* Fond océanique (fallback si WebGL indisponible) */
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background:
          radial-gradient(circle at 50% 30%, rgba(0, 145, 255, 0.22) 0%, rgba(0, 145, 255, 0) 55%),
          radial-gradient(circle at 50% 45%, #0a3b4d 0%, #051c28 45%, #02080d 100%);
        overflow: hidden;
      }

      /* Caustiques + rayons de lumière (shader WebGL plein écran) */
      #caustics {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 1080px;
        height: 1920px;
      }

      /* Vignette */
      #root::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(circle at 50% 42%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.6) 100%);
        pointer-events: none;
      }

      .stage {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .bubbles {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .bubble {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.6), rgba(120, 200, 255, 0.12) 60%, rgba(120, 200, 255, 0) 75%);
        border: 1px solid rgba(180, 230, 255, 0.25);
        will-change: transform, opacity;
      }
      .bubble.near {
        filter: blur(3px);
        z-index: 4;
      }

      .scene-content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 200px 90px;
        gap: 54px;
        box-sizing: border-box;
        text-align: center;
        will-change: transform;
      }

      /* Emblème + halo */
      .logo-wrap {
        position: relative;
        width: 560px;
        height: 560px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .glow {
        position: absolute;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(33, 196, 123, 0.5) 0%, rgba(0, 145, 255, 0.22) 40%, rgba(0, 145, 255, 0) 70%);
        filter: blur(6px);
      }
      .logo-mask {
        position: relative;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        overflow: hidden;
        background: #ffffff;
        box-shadow:
          0 0 0 10px rgba(255, 255, 255, 0.08),
          0 24px 70px rgba(0, 0, 0, 0.55),
          0 0 70px rgba(33, 196, 123, 0.4);
      }
      .logo {
        width: 520px;
        height: 520px;
        object-fit: contain;
        display: block;
      }
      /* Reflet diagonal qui balaie l'emblème */
      .logo-shine {
        position: absolute;
        top: -25%;
        left: 0;
        width: 38%;
        height: 150%;
        transform: rotate(18deg) translateX(-300px);
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.65) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        pointer-events: none;
      }

      .name {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: 10px;
        color: #ffffff;
        text-shadow: 0 0 28px rgba(33, 196, 123, 0.45);
        perspective: 600px;
        white-space: nowrap;
      }
      .ltr {
        display: inline-block;
        transform-origin: 50% 100%;
      }

      .divider {
        width: 280px;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, rgba(33, 196, 123, 0) 0%, #21c47b 50%, rgba(33, 196, 123, 0) 100%);
      }

      .tagline {
        font-size: 38px;
        font-weight: 500;
        letter-spacing: 2px;
        color: rgba(235, 248, 255, 0.92);
        line-height: 1.4;
        max-width: 820px;
      }

      .badge {
        margin-top: 8px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #04140d;
        background: linear-gradient(135deg, #2fe093 0%, #21c47b 100%);
        padding: 20px 46px;
        border-radius: 999px;
        box-shadow: 0 10px 40px rgba(33, 196, 123, 0.5);
      }

      .fade-overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        background: #02080d;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="caustics" width="1080" height="1920"></canvas>

      <div class="stage">
        <div class="bubbles" id="bubbles"></div>

        <div class="scene-content">
          <div class="logo-wrap">
            <div class="glow"></div>
            <div class="logo-mask">
              <img class="logo" src="logo.png" alt="Logo Dark Massilia — Karim Saari" />
              <div class="logo-shine" data-layout-allow-overflow></div>
            </div>
          </div>
          <div class="name">KARIM SAARI</div>
          <div class="divider"></div>
          <div class="tagline">Apnée · Photographie sous-marine · Marseille</div>
          <div class="badge">Photographe</div>
        </div>
      </div>

      <div class="fade-overlay"></div>
    </div>

    <script>
      /* ---------- PRNG déterministe (mulberry32) ---------- */
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(20260613);
      const COMP_W = 1080;
      const COMP_H = 1920;
      const DURATION = 6;

      /* ---------- Caustiques sous-marines (WebGL) ---------- */
      let drawShader = null;
      (function initShader() {
        const canvas = document.getElementById("caustics");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return; // fallback : le dégradé CSS de #root reste visible

        const vsrc =
          "attribute vec2 a_pos; varying vec2 v_uv;" +
          "void main(){ v_uv = a_pos*0.5+0.5; gl_Position = vec4(a_pos,0.0,1.0); }";

        const fsrc = [
          "precision highp float;",
          "varying vec2 v_uv;",
          "uniform float u_time;",
          "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }",
          "float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);",
          "  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }",
          "float fbm(vec2 p){ float v=0.0,a=0.5; mat2 R=mat2(0.8,0.6,-0.6,0.8);",
          "  for(int i=0;i<5;i++){ v+=a*noise(p); p=R*p*2.02; a*=0.5; } return v; }",
          "void main(){",
          "  vec2 uv = v_uv;",
          "  vec2 p = uv; p.x *= 0.5625;", // aspect 1080/1920
          "  float t = u_time;",
          "  float depth = uv.y;", // 0 bas .. 1 surface
          "  vec3 deep = vec3(0.01,0.05,0.09);",
          "  vec3 shallow = vec3(0.03,0.30,0.42);",
          "  vec3 col = mix(deep, shallow, pow(depth,1.25));",
          // caustiques : fbm domain-warpé, veines fines
          "  vec2 cuv = p*3.4;",
          "  vec2 q = vec2(fbm(cuv + t*0.16), fbm(cuv + vec2(3.1,1.7) - t*0.13));",
          "  float n = fbm(cuv + q*2.6 + t*0.10);",
          "  float caustic = pow(n, 3.2);",
          "  caustic *= smoothstep(0.05, 1.0, depth);",
          "  col += vec3(0.22,0.85,0.78) * caustic * 1.1;",
          // rayons de lumière verticaux dérivant lentement
          "  float rx = p.x*1.6 + sin(t*0.18)*0.6;",
          "  float rays = pow(0.5+0.5*sin(rx*5.0)*sin(rx*2.1+1.3), 5.0);",
          "  rays *= smoothstep(0.15, 1.0, depth);",
          "  col += vec3(0.10,0.45,0.62) * rays * 0.30;",
          // vignette
          "  col *= 1.0 - 0.5*length(v_uv-0.5);",
          "  gl_FragColor = vec4(col, 1.0);",
          "}",
        ].join("\n");

        function compile(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        }
        const prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, "a_pos");
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        const uTime = gl.getUniformLocation(prog, "u_time");
        gl.viewport(0, 0, COMP_W, COMP_H);

        drawShader = function (time) {
          gl.uniform1f(uTime, time);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        };
        drawShader(0);
      })();

      /* ---------- Bulles (2 niveaux de profondeur) ---------- */
      const bubblesEl = document.getElementById("bubbles");
      const bubbles = [];
      const NUM_BUBBLES = 22;
      for (let i = 0; i < NUM_BUBBLES; i++) {
        const near = i < 6; // 6 bulles d'avant-plan (grosses, floues, rapides)
        const size = near ? 34 + Math.floor(rand() * 40) : 6 + Math.floor(rand() * 22);
        const x = Math.floor(rand() * (COMP_W - size));
        const startY = Math.floor(COMP_H * 0.4 + rand() * COMP_H * 0.65);
        const rise = (near ? COMP_H * 0.9 : COMP_H * 0.55) + rand() * COMP_H * 0.45;
        const dur = (near ? 2.8 : 3.6) + rand() * 2.6;
        const delay = rand() * 1.4;
        const drift = (rand() - 0.5) * (near ? 120 : 70);
        const peakOpacity = (near ? 0.18 : 0.3) + rand() * 0.4;

        const el = document.createElement("div");
        el.className = near ? "bubble near" : "bubble";
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.left = x + "px";
        el.style.top = startY + "px";
        bubblesEl.appendChild(el);
        bubbles.push({ el, rise, dur, delay, drift, peakOpacity });
      }

      /* ---------- Titre cinétique : lettres ---------- */
      const nameEl = document.querySelector(".name");
      const NAME = "KARIM SAARI";
      nameEl.textContent = "";
      const letters = [];
      for (const ch of NAME) {
        const s = document.createElement("span");
        s.className = "ltr";
        if (ch === " ") {
          s.style.width = "0.42em";
          s.innerHTML = "&nbsp;";
        } else {
          s.textContent = ch;
        }
        nameEl.appendChild(s);
        letters.push(s);
      }

      /* ---------- Timeline ---------- */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Caustiques pilotées par la timeline (déterministe, ease none)
      if (drawShader) {
        const proxy = { t: 0 };
        tl.to(
          proxy,
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: function () {
              drawShader(proxy.t);
            },
          },
          0
        );
      }

      // Bulles : montée ascendante (eases doux)
      bubbles.forEach((b) => {
        tl.fromTo(
          b.el,
          { y: 0, x: 0, opacity: 0 },
          { y: -b.rise, x: b.drift, opacity: b.peakOpacity, duration: b.dur, ease: "sine.out" },
          b.delay
        );
        tl.to(b.el, { opacity: 0, duration: b.dur * 0.4, ease: "power1.in" }, b.delay + b.dur * 0.6);
      });

      // Push-in cinématique sur toute la scène
      tl.fromTo(".scene-content", { scale: 0.985 }, { scale: 1.05, duration: DURATION, ease: "sine.inOut" }, 0);

      // Entrées de scène (eases variés)
      tl.from(".glow", { scale: 0.6, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from(".logo-mask", { scale: 0.7, opacity: 0, duration: 0.85, ease: "back.out(1.6)" }, 0.3);

      // Reflet qui balaie l'emblème (une passe)
      tl.fromTo(
        ".logo-shine",
        { x: -320 },
        { x: 760, duration: 0.9, ease: "power2.inOut" },
        1.05
      );

      // Titre : lettres qui se relèvent
      tl.from(
        letters,
        { yPercent: 130, opacity: 0, rotationX: -90, duration: 0.55, ease: "back.out(1.7)", stagger: 0.045 },
        0.8
      );

      tl.from(".divider", { scaleX: 0, opacity: 0, duration: 0.7, ease: "expo.out", transformOrigin: "center center" }, 1.45);
      tl.from(".tagline", { y: 28, opacity: 0, duration: 0.55, ease: "power2.out" }, 1.65);
      tl.from(".badge", { scale: 0.8, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 1.9);

      // Pulsation douce du halo (répétitions finies)
      tl.to(".glow", { scale: 1.12, opacity: 0.7, duration: 1.3, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.4);

      // Fondu au noir final
      tl.to(".fade-overlay", { opacity: 1, duration: 0.6, ease: "power1.in" }, 5.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
