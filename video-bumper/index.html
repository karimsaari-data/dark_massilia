<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #02080d;
        font-family: "Inter", sans-serif;
      }

      /* Fond océanique profond — dégradés radiaux (pas de linéaire plein écran : évite le banding H.264) */
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background:
          radial-gradient(circle at 50% 32%, rgba(0, 145, 255, 0.22) 0%, rgba(0, 145, 255, 0) 55%),
          radial-gradient(circle at 50% 78%, rgba(33, 196, 123, 0.18) 0%, rgba(33, 196, 123, 0) 60%),
          radial-gradient(circle at 50% 45%, #0a3b4d 0%, #051c28 45%, #02080d 100%);
        overflow: hidden;
      }

      /* Vignette douce pour concentrer le regard au centre */
      #root::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.55) 100%);
        pointer-events: none;
      }

      .stage {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .bubbles {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .bubble {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55), rgba(120, 200, 255, 0.12) 60%, rgba(120, 200, 255, 0) 75%);
        border: 1px solid rgba(180, 230, 255, 0.25);
      }

      .scene-content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 200px 90px;
        gap: 56px;
        box-sizing: border-box;
        text-align: center;
      }

      /* Halo lumineux derrière l'emblème */
      .logo-wrap {
        position: relative;
        width: 560px;
        height: 560px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .glow {
        position: absolute;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(33, 196, 123, 0.45) 0%, rgba(0, 145, 255, 0.2) 40%, rgba(0, 145, 255, 0) 70%);
        filter: blur(6px);
      }
      .logo {
        position: relative;
        width: 520px;
        height: 520px;
        object-fit: contain;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 0 0 10px rgba(255, 255, 255, 0.08),
          0 24px 70px rgba(0, 0, 0, 0.55),
          0 0 60px rgba(33, 196, 123, 0.35);
      }

      .name {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: 10px;
        color: #ffffff;
        text-shadow: 0 0 28px rgba(33, 196, 123, 0.45);
      }

      .divider {
        width: 280px;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, rgba(33, 196, 123, 0) 0%, #21c47b 50%, rgba(33, 196, 123, 0) 100%);
      }

      .tagline {
        font-size: 38px;
        font-weight: 500;
        letter-spacing: 2px;
        color: rgba(235, 248, 255, 0.92);
        line-height: 1.4;
        max-width: 820px;
      }

      .badge {
        margin-top: 8px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #04140d;
        background: linear-gradient(135deg, #2fe093 0%, #21c47b 100%);
        padding: 20px 46px;
        border-radius: 999px;
        box-shadow: 0 10px 40px rgba(33, 196, 123, 0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div class="stage">
        <div class="bubbles" id="bubbles"></div>

        <div class="scene-content">
          <div class="logo-wrap">
            <div class="glow"></div>
            <img class="logo" src="logo.png" alt="Logo Dark Massilia — Karim Saari" />
          </div>
          <div class="name">KARIM&nbsp;SAARI</div>
          <div class="divider"></div>
          <div class="tagline">Apnée · Photographie sous-marine · Marseille</div>
          <div class="badge">Projet Sentinelle</div>
        </div>
      </div>
    </div>

    <script>
      // PRNG déterministe (mulberry32) — pas de Math.random() : rendu reproductible
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(20260613);
      const COMP_W = 1080;
      const COMP_H = 1920;
      const NUM_BUBBLES = 18;

      const bubblesEl = document.getElementById("bubbles");
      const bubbles = [];
      for (let i = 0; i < NUM_BUBBLES; i++) {
        const size = 8 + Math.floor(rand() * 30); // 8–38px
        const x = Math.floor(rand() * (COMP_W - size));
        const startY = Math.floor(COMP_H * 0.35 + rand() * COMP_H * 0.7); // réparties sur la moitié basse
        const rise = COMP_H * 0.6 + rand() * COMP_H * 0.5; // distance de montée
        const dur = 3.2 + rand() * 2.6;
        const delay = rand() * 1.2;
        const drift = (rand() - 0.5) * 80; // léger zigzag horizontal
        const peakOpacity = 0.25 + rand() * 0.45;

        const el = document.createElement("div");
        el.className = "bubble";
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.left = x + "px";
        el.style.top = startY + "px";
        bubblesEl.appendChild(el);
        bubbles.push({ el, rise, dur, delay, drift, peakOpacity });
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // --- Bulles : montée ascendante en une passe (déterministe) ---
      bubbles.forEach((b) => {
        tl.fromTo(
          b.el,
          { y: 0, x: 0, opacity: 0 },
          {
            y: -b.rise,
            x: b.drift,
            opacity: b.peakOpacity,
            duration: b.dur,
            ease: "sine.out",
          },
          b.delay
        );
        // fondu de sortie en fin de course
        tl.to(b.el, { opacity: 0, duration: b.dur * 0.4, ease: "power1.in" }, b.delay + b.dur * 0.6);
      });

      // --- Entrées de scène (entrance uniquement, eases variés) ---
      tl.from(".glow", { scale: 0.6, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from(".logo", { scale: 0.7, opacity: 0, duration: 0.85, ease: "back.out(1.6)" }, 0.3);
      tl.from(".name", { y: 55, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.75);
      tl.from(".divider", { scaleX: 0, opacity: 0, duration: 0.7, ease: "expo.out", transformOrigin: "center center" }, 1.0);
      tl.from(".tagline", { y: 28, opacity: 0, duration: 0.55, ease: "power2.out" }, 1.2);
      tl.from(".badge", { scale: 0.8, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 1.45);

      // --- Pulsation douce du halo (répétitions finies — jamais repeat:-1) ---
      tl.to(
        ".glow",
        { scale: 1.12, opacity: 0.65, duration: 1.2, ease: "sine.inOut", repeat: 1, yoyo: true },
        1.1
      );

      // --- Sortie finale (seule scène : fondu autorisé) ---
      tl.to(".stage", { opacity: 0, duration: 0.55, ease: "power1.in" }, 4.45);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
