name: Daily GSC Collect

on:
  schedule:
    - cron: '0 6 * * *'   # Chaque jour à 6h UTC (données J-2, délai GSC)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Jours à backfiller (ex: 90 pour depuis le 1er janvier)'
        required: false
        default: '1'
      backfill_weeks:
        description: 'Semaines à backfiller pour gsc_weekly_queries (ex: 12)'
        required: false
        default: '1'
      skip_report:
        description: 'Ne pas envoyer le rapport email (true/false)'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

jobs:
  gsc-collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installation Chrome (pour Puppeteer PDF)
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -q && sudo apt-get install -y google-chrome-stable

      - name: Installation des dépendances
        run: npm ci

      - name: Collecte Cloudflare → Supabase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID:   ${{ secrets.CLOUDFLARE_ZONE_ID }}
          VITE_SUPABASE_URL:    ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS:        ${{ github.event.inputs.backfill_days || '1' }}
        run: node scripts/cloudflare-collect.js

      - name: Collecte GSC → Supabase
        env:
          GSC_CLIENT_ID:        ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET:    ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN:    ${{ secrets.GSC_REFRESH_TOKEN }}
          VITE_SUPABASE_URL:    ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS:        ${{ github.event.inputs.backfill_days || '1' }}
          BACKFILL_WEEKS:       ${{ github.event.inputs.backfill_weeks || '1' }}
        run: node scripts/gsc-collect.js

      - name: Collecte Brevo → Supabase
        env:
          BREVO_API_KEY:        ${{ secrets.BREVO_API_KEY }}
          VITE_SUPABASE_URL:    ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/brevo-collect.js

      - name: Rapport journalier (GSC + Cloudflare) → Brevo
        if: ${{ github.event.inputs.skip_report != 'true' }}
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BREVO_API_KEY:          ${{ secrets.BREVO_API_KEY }}
        run: node scripts/gsc-daily-report.js
