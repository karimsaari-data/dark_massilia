name: Monthly SEO Crawl (On-Page Audit)

on:
  schedule:
    - cron: '0 8 1 * *'  # 1er de chaque mois à 8h UTC = 9h/10h Paris
  workflow_dispatch:        # Déclenchement manuel possible

jobs:
  seo-crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Build (génère dist/ avec HTML pré-rendu)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_APP_NAME: Dark Massilia
          VITE_APP_URL: https://karimsaari.com
          VITE_CONTACT_EMAIL: contact@karimsaari.com
          VITE_CONTACT_WHATSAPP: "+33695331301"
          VITE_INSTAGRAM_URL: https://www.instagram.com/karimsaari
          VITE_TIKTOK_URL: https://www.tiktok.com/@dark.massilia
          VITE_YOUTUBE_URL: https://www.youtube.com/@dark.massilia
          VITE_500PX_URL: https://500px.com/p/karimsaari
          VITE_LINKEDIN_URL: https://www.linkedin.com/in/karimsaari/
          VITE_FACEBOOK_GROUP_URL: https://www.facebook.com/groups/calanque/
          VITE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.VITE_INSTAGRAM_ACCESS_TOKEN }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: npm run build:full

      - name: Crawl On-Page SEO + email (lecture dist/)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: npm run seo-crawl
