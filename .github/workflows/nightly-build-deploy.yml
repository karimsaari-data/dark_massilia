name: Build nocturne & Déploiement FTP

on:
  push:
    branches:
      - main               # déploiement automatique à chaque push/merge sur main
  schedule:
    - cron: '0 3 * * *'   # 3h UTC = 4h/5h heure de Paris
  workflow_dispatch:        # déclenchement manuel depuis GitHub Actions
    inputs:
      force_images:
        description: 'Forcer l''upload de TOUTES les images (626 Mo, ~20 min)'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch:
    types: [wp-article-published]  # déclenché par le webhook WordPress à chaque publication

# ── Anti-collision FTP ────────────────────────────────────────────────────────
# Un seul déploiement à la fois. Si un nouveau push arrive pendant qu'un run
# tourne, le run en cours est annulé pour éviter les uploads FTP simultanés
# qui mélangent les hash d'assets de builds différents (page blanche).
# Le cron nocturne n'annule pas les deploys push (groupe séparé).
concurrency:
  group: deploy-${{ github.event_name == 'schedule' && 'cron' || 'push' }}
  cancel-in-progress: true

permissions:
  contents: write           # nécessaire pour committer .notified-slugs.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # anticipe la migration Node 24 (obligatoire juin 2026)

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. Dépendances ───────────────────────────────────────────────────────
      - name: Installation des dépendances
        run: npm ci

      # ── 3b. Sync WordPress → Supabase blog_posts ────────────────────────────
      - name: Sync articles WordPress → Supabase
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/sync-wp-to-supabase.mjs

      # ── 3b-bis. Import stats Facebook (CSV data/ → Supabase) ─────────────────
      # Importe les exports data/Facebook_Group_Insights_*.csv versionnés dans
      # la table facebook_group_insights. Idempotent (upsert par date) : déposer
      # un nouveau CSV + push suffit, l'import se fait automatiquement.
      - name: Import stats Facebook → Supabase
        continue-on-error: true
        run: node scripts/import-facebook-insights.js

      # ── 3c. Mise à jour alt text images WordPress ────────────────────────────
      - name: Mise à jour alt text images WordPress
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/update-wp-alt-text.mjs --apply

      # ── 3c. Alt text Vision (nouvelles images uniquement, cache JSON) ─────────
      - name: Alt text Vision — nouvelles images
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/wp-alt-vision.mjs --apply --posts-only

      # ── 3d. Titres/descriptions photos Vision (nouvelles uniquement, cache) ────
      - name: Titres & descriptions photos — Vision
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/photos-vision-titles.mjs --apply

      # ── 3e. Alt + titres galeries paysage & sous-marine (cache) ──────────────
      - name: Alt & titres galeries — Vision
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/galleries-vision-alt.mjs --apply

      # ── 4. Build complet ─────────────────────────────────────────────────────
      - name: Build (sitemap + vite + prerender)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_APP_NAME: Dark Massilia
          VITE_APP_URL: https://karimsaari.com
          VITE_CONTACT_EMAIL: contact@karimsaari.com
          VITE_CONTACT_WHATSAPP: "+33695331301"
          VITE_INSTAGRAM_URL: https://www.instagram.com/karimsaari
          VITE_TIKTOK_URL: https://www.tiktok.com/@dark.massilia
          VITE_YOUTUBE_URL: https://www.youtube.com/@dark.massilia
          VITE_500PX_URL: https://500px.com/p/karimsaari
          VITE_LINKEDIN_URL: https://www.linkedin.com/in/karimsaari/
          VITE_FACEBOOK_GROUP_URL: https://www.facebook.com/groups/calanque/
          VITE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.VITE_INSTAGRAM_ACCESS_TOKEN }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: npm run build:full

      # ── 4b. Sync indexed_pages + titres → Supabase ──────────────────────────
      - name: Sync indexed_pages (URLs + titres)
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-indexed-pages.mjs

      # ── 5. Déploiement FTP ───────────────────────────────────────────────────
      - name: Déploiement FTP vers karimsaari.com/home
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.cluster1.easy-hebergement.net
          username: karimsaari
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: home/
          # dangerous-clean-slate: true  # désactivé — sync state corrigée
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            # Les images (626 Mo) sont déjà sur le serveur — on les exclut
            # pour que les déploiements restent rapides (< 5 min).
            # Pour forcer un re-upload des images : commenter temporairement ces lignes.
            images/**
            !images/karim-saari.vcf

      # ── 5b. Upload images nouvelles ou modifiées via registry Supabase ────────
      # Le step FTP principal exclut images/** pour la perf (626 Mo).
      # Ce step compare dist/images/ avec la table images_registry (Supabase) :
      #   - fichier absent de la registry  → upload
      #   - taille changée depuis dernier upload → upload
      #   - inchangé → skip
      # Après upload réussi, uploaded_at est mis à jour dans la registry.
      # force_images=true : mirror complet via lftp + marque tout uploadé.
      - name: Upload images nouvelles ou modifiées FTP
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          FORCE="${{ inputs.force_images }}"

          if [ "$FORCE" = "true" ]; then
            echo "🗂️  Mode force : upload de toutes les images dist/images/"
            sudo apt-get install -y lftp -q 2>/dev/null
            lftp -e "
              set ftp:passive-mode on
              open -u karimsaari,$FTP_PASS ftp.cluster1.easy-hebergement.net
              mirror -R dist/images home/images
              bye
            "
            echo "✅ Toutes les images uploadées"
            node scripts/images-ftp-sync.mjs --mark-all-uploaded
            exit 0
          fi

          # Détecter via registry Supabase les images nouvelles ou modifiées
          node scripts/images-ftp-sync.mjs

          if [ ! -s /tmp/ftp-upload-list.txt ]; then
            echo "Aucune image à uploader"
            exit 0
          fi

          COUNT=$(wc -l < /tmp/ftp-upload-list.txt)
          echo "📸 $COUNT image(s) à uploader"

          sudo apt-get install -y lftp -q 2>/dev/null

          (
            echo "set ftp:passive-mode on"
            echo "set cmd:fail-exit yes"
            echo "open -u karimsaari,$FTP_PASS ftp.cluster1.easy-hebergement.net"
            while IFS= read -r path; do
              local_file="dist/$path"
              remote_dir="home/$(dirname "$path")"
              # Chemins quotés : indispensable pour les noms contenant des
              # espaces (sinon lftp tronque au premier espace → upload cassé).
              echo "mkdir -fp \"$remote_dir\""
              echo "put \"$local_file\" -o \"home/$path\""
            done < /tmp/ftp-upload-list.txt
            echo "bye"
          ) | lftp
          LFTP_EXIT=${PIPESTATUS[0]}

          if [ "$LFTP_EXIT" -ne 0 ]; then
            echo "⚠️  lftp a signalé une erreur (exit $LFTP_EXIT) — registry NON marquée"
            exit "$LFTP_EXIT"
          fi

          echo "✅ $COUNT image(s) uploadée(s)"
          node scripts/images-ftp-sync.mjs --mark-uploaded /tmp/ftp-upload-list.txt

      # ── 6. Purge cache Cloudflare ────────────────────────────────────────────
      - name: Purge cache Cloudflare
        id: purge_cf
        continue-on-error: true   # ne bloque pas le workflow si CF est indisponible
        run: |
          RESULT=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESULT" | jq -r 'if .success then "✅ Cache Cloudflare purgé" else "❌ Échec: \(.errors[0].message // .errors)" end'
          echo "$RESULT" | jq -e '.success == true' > /dev/null || exit 1

      # ── 6b. Email notification purge ─────────────────────────────────────────
      - name: Email — purge Cloudflare réussie
        if: steps.purge_cf.outcome == 'success'
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{
              "sender":  { "name": "GitHub Actions", "email": "contact@karimsaari.com" },
              "to":      [{ "email": "contact@karimsaari.com" }],
              "subject": "✅ Déploiement réussi — cache Cloudflare purgé",
              "textContent": "Le site karimsaari.com a été déployé et le cache Cloudflare purgé avec succès.\n\nLogs : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' > /dev/null
          echo "📧 Email succès envoyé"

      - name: Email — purge Cloudflare échouée
        if: steps.purge_cf.outcome == 'failure'
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{
              "sender":  { "name": "GitHub Actions", "email": "contact@karimsaari.com" },
              "to":      [{ "email": "contact@karimsaari.com" }],
              "subject": "⚠️ Purge cache Cloudflare échouée — karimsaari.com",
              "textContent": "La purge automatique du cache Cloudflare a échoué lors du dernier déploiement.\n\nVérifie le token dans GitHub Secrets (CLOUDFLARE_API_TOKEN).\n\nLogs : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' > /dev/null
          echo "📧 Email alerte envoyé"

      # ── 7. Notification Brevo (nouveaux articles seulement) ─────────────────
      - name: Notify nouveaux articles (Brevo)
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: https://karimsaari.com
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: npm run notify

      # ── 8. Commit fichiers de persistance (cache WP JSON + alt vision) ──────────
      # notified-slugs.json est remplacé par notified_at dans Supabase blog_posts
      - name: Commit scripts persistants
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/wp-posts-cache.json scripts/wp-alt-vision-cache.json
          if git diff --staged --quiet; then
            echo "Aucun changement, pas de commit."
          else
            git commit -m "chore: update wp-cache + alt-vision-cache [skip ci]"
            git stash --include-untracked || true
            git pull --rebase origin main
            git stash pop || true
            git push
          fi

      # ── 9. IndexNow (notifier Google/Bing des nouvelles URLs) ────────────────
      - name: IndexNow
        run: npm run indexnow
