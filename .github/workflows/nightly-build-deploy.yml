name: Build nocturne & Déploiement FTP

on:
  push:
    branches:
      - main               # déploiement automatique à chaque push/merge sur main
  schedule:
    - cron: '0 3 * * *'   # 3h UTC = 4h/5h heure de Paris
  workflow_dispatch:        # déclenchement manuel depuis GitHub Actions
  repository_dispatch:
    types: [wp-article-published]  # déclenché par le webhook WordPress à chaque publication

# ── Anti-collision FTP ────────────────────────────────────────────────────────
# Un seul déploiement à la fois. Si un nouveau push arrive pendant qu'un run
# tourne, le run en cours est annulé pour éviter les uploads FTP simultanés
# qui mélangent les hash d'assets de builds différents (page blanche).
# Le cron nocturne n'annule pas les deploys push (groupe séparé).
concurrency:
  group: deploy-${{ github.event_name == 'schedule' && 'cron' || 'push' }}
  cancel-in-progress: true

permissions:
  contents: write           # nécessaire pour committer .notified-slugs.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # anticipe la migration Node 24 (obligatoire juin 2026)

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. Dépendances ───────────────────────────────────────────────────────
      - name: Installation des dépendances
        run: npm ci

      # ── 3b. Mise à jour alt text images WordPress ────────────────────────────
      - name: Mise à jour alt text images WordPress
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/update-wp-alt-text.mjs --apply

      # ── 3c. Alt text Vision (nouvelles images uniquement, cache JSON) ─────────
      - name: Alt text Vision — nouvelles images
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/wp-alt-vision.mjs --apply --posts-only

      # ── 4. Build complet ─────────────────────────────────────────────────────
      - name: Build (sitemap + vite + prerender)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_APP_NAME: Dark Massilia
          VITE_APP_URL: https://karimsaari.com
          VITE_CONTACT_EMAIL: contact@karimsaari.com
          VITE_CONTACT_WHATSAPP: "+33695331301"
          VITE_INSTAGRAM_URL: https://www.instagram.com/karimsaari
          VITE_TIKTOK_URL: https://www.tiktok.com/@dark.massilia
          VITE_YOUTUBE_URL: https://www.youtube.com/@dark.massilia
          VITE_500PX_URL: https://500px.com/p/karimsaari
          VITE_LINKEDIN_URL: https://www.linkedin.com/in/karimsaari/
          VITE_FACEBOOK_GROUP_URL: https://www.facebook.com/groups/calanque/
          VITE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.VITE_INSTAGRAM_ACCESS_TOKEN }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: npm run build:full

      # ── 5. Déploiement FTP ───────────────────────────────────────────────────
      - name: Déploiement FTP vers karimsaari.com/home
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.cluster1.easy-hebergement.net
          username: karimsaari
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: home/
          # dangerous-clean-slate: true  # désactivé — sync state corrigée
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            # Les images (626 Mo) sont déjà sur le serveur — on les exclut
            # pour que les déploiements restent rapides (< 5 min).
            # Pour forcer un re-upload des images : commenter temporairement ces lignes.
            images/**
            !images/karim-saari.vcf

      # ── 6. Purge cache Cloudflare ────────────────────────────────────────────
      - name: Purge cache Cloudflare
        id: purge_cf
        continue-on-error: true   # ne bloque pas le workflow si CF est indisponible
        run: |
          RESULT=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESULT" | jq -r 'if .success then "✅ Cache Cloudflare purgé" else "❌ Échec: \(.errors[0].message // .errors)" end'
          echo "$RESULT" | jq -e '.success == true' > /dev/null || exit 1

      # ── 6b. Email notification purge ─────────────────────────────────────────
      - name: Email — purge Cloudflare réussie
        if: steps.purge_cf.outcome == 'success'
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{
              "sender":  { "name": "GitHub Actions", "email": "contact@karimsaari.com" },
              "to":      [{ "email": "contact@karimsaari.com" }],
              "subject": "✅ Déploiement réussi — cache Cloudflare purgé",
              "textContent": "Le site karimsaari.com a été déployé et le cache Cloudflare purgé avec succès.\n\nLogs : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' > /dev/null
          echo "📧 Email succès envoyé"

      - name: Email — purge Cloudflare échouée
        if: steps.purge_cf.outcome == 'failure'
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{
              "sender":  { "name": "GitHub Actions", "email": "contact@karimsaari.com" },
              "to":      [{ "email": "contact@karimsaari.com" }],
              "subject": "⚠️ Purge cache Cloudflare échouée — karimsaari.com",
              "textContent": "La purge automatique du cache Cloudflare a échoué lors du dernier déploiement.\n\nVérifie le token dans GitHub Secrets (CLOUDFLARE_API_TOKEN).\n\nLogs : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' > /dev/null
          echo "📧 Email alerte envoyé"

      # ── 7. Notification Brevo (nouveaux articles seulement) ─────────────────
      - name: Notify nouveaux articles (Brevo)
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: https://karimsaari.com
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: npm run notify

      # ── 8. Commit fichiers de persistance (notified-slugs + cache WP) ──────────
      - name: Commit scripts persistants
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/.notified-slugs.json scripts/wp-posts-cache.json scripts/wp-alt-vision-cache.json
          if git diff --staged --quiet; then
            echo "Aucun changement, pas de commit."
          else
            git commit -m "chore: update wp-cache + notified-slugs [skip ci]"
            git stash --include-untracked || true
            git pull --rebase origin main
            git stash pop || true
            git push
          fi

      # ── 9. IndexNow (notifier Google/Bing des nouvelles URLs) ────────────────
      - name: IndexNow
        run: npm run indexnow
