name: Lighthouse CI

on:
  schedule:
    - cron: '30 4 * * *'   # 4h30 UTC = après le build nocturne (3h UTC ~40min)
  workflow_dispatch:         # déclenchement manuel possible

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Lighthouse CI ─────────────────────────────────────────────────────
      - name: Installer @lhci/cli
        run: npm install -g @lhci/cli@0.14.x

      - name: Audit Lighthouse (4 pages)
        run: lhci autorun
        # Seuils définis dans .lighthouserc.json :
        #   SEO ≥ 90        → error  (fail + email GitHub si chute)
        #   Performance ≥ 60 → error  (fail si très dégradé)
        #   Accessibility ≥ 80 → warn
        #   Best Practices ≥ 80 → warn

      # ── 4. Upload des rapports HTML ──────────────────────────────────────────
      - name: Sauvegarder les rapports
        uses: actions/upload-artifact@v4
        if: always()          # même en cas d'échec
        with:
          name: lighthouse-reports-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30
