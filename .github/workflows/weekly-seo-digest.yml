name: Weekly SEO Digest

on:
  schedule:
    - cron: '0 7 * * 0'   # Chaque dimanche à 7h UTC = 8h/9h Paris
  workflow_dispatch:        # Déclenchement manuel possible

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seo-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Générer et envoyer le digest SEO
        env:
          GSC_CLIENT_ID:     ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          BREVO_API_KEY:     ${{ secrets.BREVO_API_KEY }}
        run: npm run seo-digest
